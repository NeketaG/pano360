name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass и другие API iOS 26 доступны только с Xcode 26 (iOS 26 SDK).
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode 26 не найден на этом образе"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          grep -rn "captureHighResolutionFrame" \
            "$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/ARKit.framework/Headers/" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project Pano360.xcodeproj \
            -scheme Pano360 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Pano360.app Payload/
          mkdir -p artifact
          zip -r artifact/Pano360.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pano360-ipa
          path: artifact/Pano360.ipa
